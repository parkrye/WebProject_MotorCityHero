<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>모터시티 히어로</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="cabinet">
    <canvas id="game" width="1024" height="768"></canvas>
  </main>

  <!-- 터치 기기에서만 보인다. js/touch.js 가 body 에 touch-enabled 를 붙인다. -->
  <div class="touch" id="touch">
    <div class="stick" data-stick>
      <span class="knob" data-knob></span>
    </div>
    <!-- 오락기처럼 글자 없이 색으로만 구분한다. 왼쪽부터 J(빨강) K(노랑) L(초록). -->
    <div class="buttons">
      <button type="button" class="key jump" data-action="jump" aria-label="JUMP"></button>
      <button type="button" class="key punch" data-action="action" aria-label="PUNCH"></button>
      <button type="button" class="key kick" data-action="kick" aria-label="KICK"></button>
    </div>
    <button type="button" class="key coin" data-action="coin" aria-label="INSERT COIN"></button>
  </div>

  <!-- build_sprites.py 가 구운 스프라이트 매니페스트 -->
  <script src="assets/sprites.js"></script>

  <script src="js/config.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/bitmapfont.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sign.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/input.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/pickup.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/crt.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
